version: 2

# Realistischer ELT-Fluss (Boris, 08.10.2026): Fivetran repliziert das
# "Betriebssystem" (Stand-in: BORIS_DEMO_DWH.DEMO_DWH) in die Landing-Zone
# FIVETRAN_DB.FIVETRAN_STAGE_DEMO_DWH; dbt liest nur noch von dort.
sources:
  - name: raw_retail
    description: "Von Fivetran repliziert aus BORIS_DEMO_DWH.DEMO_DWH (Connection fivetran_stage)"
    database: FIVETRAN_DB
    schema: FIVETRAN_STAGE_DEMO_DWH
    # dbt >= 1.10 / Fusion (dbt Cloud): Freshness gehoert in den config-Block
    config:
      loaded_at_field: _FIVETRAN_SYNCED
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: ORDER_FACT
      - name: ORDER_DETAIL
      - name: LU_CUSTOMER
      - name: LU_CUST_CITY
      - name: LU_CUST_STATE
      - name: LU_CUST_REGION
      - name: LU_ITEM
      - name: LU_SUBCATEG
      - name: LU_CATEGORY
